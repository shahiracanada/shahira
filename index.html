<!DOCTYPE html>
<html lang="en">
<head>

<title>Shahira Restaurant – Opening Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.7)),
        url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092') center/cover no-repeat;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    padding: 40px;
    max-width: 700px;
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 4rem;
    letter-spacing: 3px;
    margin-bottom: 10px;
    color: #f4c27a;
}

.tagline {
    font-size: 1.2rem;
    margin-bottom: 20px;
    letter-spacing: 1px;
}

.location {
    font-size: 1rem;
    margin-bottom: 40px;
    opacity: 0.9;
}

.opening {
    font-size: 2rem;
    margin-bottom: 30px;
    color: #f4c27a;
}

.countdown {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.time-box {
    background: rgba(255,255,255,0.1);
    padding: 15px 20px;
    border-radius: 10px;
    min-width: 90px;
}

.time-box h2 {
    font-size: 2rem;
    color: #f4c27a;
}

.time-box span {
    font-size: 0.8rem;
    letter-spacing: 1px;
}

.footer {
    margin-top: 40px;
    font-size: 0.9rem;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">
    <div class="logo">Shahira</div>

    <div class="tagline">
        Hyderabadi Nawabi & Arabic Cuisine
    </div>

    <div class="location">
        Opening Soon in Toronto, Canada
    </div>

    <div class="opening">
        Grand Opening Coming Soon
    </div>
